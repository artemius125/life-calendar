<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Календарь жизни</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #11111f;
      --surface:   #191928;
      --border:    rgba(255,255,255,0.09);
      --text:      #c8c8e0;
      --muted:     #52526e;
      --accent:    #4c6ef5;
      --gold:      #ffd43b;
      --gold-glow: rgba(255,212,59,0.45);
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3.5rem 1.5rem 6rem;
    }

    /* ── Header ── */
    .header { text-align: center; margin-bottom: 2rem; }

    h1 {
      font-size: 1.75rem;
      font-weight: 200;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .header-meta { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.12em; }

    /* ── Settings ── */
    .settings-panel {
      width: min(720px, 96vw);
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(18,18,32,0.97);
      padding: 0.95rem 1rem;
      margin-bottom: 2rem;
    }

    .settings-form {
      display: flex;
      align-items: end;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .settings-field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-width: 190px;
      flex: 1;
    }

    .settings-field label {
      font-size: 0.58rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .settings-input {
      height: 34px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.17);
      background: rgba(15,15,26,0.9);
      color: #fff;
      font-family: inherit;
      font-size: 0.84rem;
      padding: 0 0.75rem;
      outline: none;
    }

    .settings-input:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(76,110,245,0.2);
    }

    .settings-actions {
      display: flex;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    .settings-btn {
      height: 34px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.17);
      background: rgba(22,22,40,0.95);
      color: #fff;
      font-family: inherit;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0 0.9rem;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .settings-btn.primary {
      border-color: rgba(76,110,245,0.5);
      background: rgba(76,110,245,0.17);
    }

    .settings-btn:hover { border-color: rgba(255,255,255,0.32); background: rgba(34,34,55,0.95); }
    .settings-btn.primary:hover { border-color: var(--accent); background: rgba(76,110,245,0.26); }
    .settings-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px rgba(76,110,245,0.2);
    }

    .settings-message {
      margin-top: 0.55rem;
      min-height: 1rem;
      font-size: 0.66rem;
      color: var(--muted);
    }
    .settings-message.error { color: #ff8d8d; }

    /* ── Live Counter ── */
    .live-counter {
      text-align: center;
      margin-bottom: 2.5rem;
      font-variant-numeric: tabular-nums;
    }

    .counter-time { font-size: 1.05rem; font-weight: 300; color: var(--text); letter-spacing: 0.04em; }
    .counter-days { color: #fff; font-weight: 500; }
    .counter-secs { color: var(--gold); }

    .counter-label {
      font-size: 0.6rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      margin-top: 0.35rem;
    }

    /* ── Stats section ── */
    .stats-section {
      width: fit-content;
      max-width: min(720px, 96vw);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      background: var(--border);
      margin-bottom: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .stats-row { display: flex; gap: 1px; }

    .stats-row.primary .stat {
      background: var(--surface);
      padding: 1.15rem 1.6rem;
      text-align: center;
      flex: 1;
      transition: background 0.2s ease;
    }
    .stats-row.primary .stat:hover { background: rgba(20,20,38,0.95); }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 600;
      color: #fff;
      line-height: 1;
      margin-bottom: 0.4rem;
      font-variant-numeric: tabular-nums;
    }
    .stat-value.blue   { color: var(--accent); }
    .stat-value.violet { color: #b47cf7; }
    .stat-value.gold   { color: var(--gold); }

    .stat-label {
      font-size: 0.58rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .stats-row.secondary .stat {
      background: rgba(18,18,32,0.97);
      padding: 0.95rem 1.3rem;
      flex: 1;
      transition: background 0.2s ease;
    }
    .stats-row.secondary .stat:hover { background: rgba(26,26,42,0.98); }

    .insight-label {
      font-size: 0.55rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.13em;
      margin-bottom: 0.55rem;
    }

    .age-breakdown { display: flex; gap: 0.9rem; align-items: baseline; }
    .age-unit { display: flex; flex-direction: column; align-items: center; }

    .age-num {
      font-size: 1.35rem;
      font-weight: 600;
      color: #fff;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .age-lbl {
      font-size: 0.55rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.25rem;
    }

    .insight-main {
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }
    .insight-main.soon { color: var(--gold); }
    .insight-main.done { color: #7be0a0; }

    .insight-sub { font-size: 0.63rem; color: var(--muted); margin-top: 0.3rem; }

    /* ── Progress bar ── */
    .progress-wrap { width: 100%; max-width: 700px; margin-bottom: 2.5rem; }

    .progress-track {
      height: 3px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px;
      position: relative;
      overflow: visible;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4c6ef5 0%, #9775fa 60%, var(--gold) 100%);
      border-radius: 2px;
      position: relative;
    }

    .progress-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px var(--gold-glow);
      position: absolute;
      right: -5.5px;
      top: 50%;
      transform: translateY(-50%);
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 0.6rem;
      font-size: 0.62rem;
      color: var(--muted);
    }

    /* ── Legend ── */
    .legend {
      display: flex;
      align-items: center;
      gap: 1.8rem;
      margin-bottom: 1.8rem;
      font-size: 0.68rem;
      color: var(--muted);
    }

    .legend-item { display: flex; align-items: center; gap: 0.45rem; }

    .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
    .legend-dot.past    { background: var(--accent); opacity: 0.75; }
    .legend-dot.current { background: var(--gold); box-shadow: 0 0 6px var(--gold-glow); }
    .legend-dot.future  { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18); }

    /* ── Calendar ── */
    .calendar-outer { position: relative; }

    .col-labels { display: flex; margin-left: 36px; margin-bottom: 4px; gap: 2px; }

    .col-label {
      width: 10px;
      font-size: 0.52rem;
      color: var(--muted);
      text-align: center;
      flex-shrink: 0;
      line-height: 1;
    }

    .grid { display: flex; flex-direction: column; gap: 2px; }

    .year-row {
      display: flex;
      align-items: center;
      gap: 2px;
      border-radius: 3px;
      transition: background 0.15s ease;
    }

    .year-row.decade-gap { margin-top: 5px; }

    .year-row:hover { background: rgba(255,255,255,0.025); }
    .year-row:hover .week.past   { opacity: 0.92; filter: brightness(1.2); }
    .year-row:hover .week.future { border-color: rgba(255,255,255,0.28); }
    .year-row:hover .row-label   { color: var(--text) !important; }

    .row-label {
      width: 32px;
      font-size: 0.58rem;
      color: var(--muted);
      text-align: right;
      padding-right: 6px;
      flex-shrink: 0;
      user-select: none;
      transition: color 0.15s ease;
    }

    .row-label.decade { color: var(--accent); font-weight: 600; font-size: 0.63rem; }

    /* ── Week cells ── */
    .week {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
      cursor: default;
      transition: transform 0.1s ease, filter 0.1s ease, opacity 0.15s ease;
    }

    .week:hover { transform: scale(1.7); z-index: 5; filter: brightness(1.4) !important; }
    .week:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .week.past  { opacity: 0.72; }

    .week.current {
      background: var(--gold) !important;
      opacity: 1;
      box-shadow: 0 0 7px var(--gold-glow), 0 0 14px rgba(255,212,59,0.25);
      animation: breathe 2.8s ease-in-out infinite;
    }

    .week.future {
      background: rgba(255,255,255,0.06) !important;
      border: 1px solid rgba(255,255,255,0.18);
    }

    @keyframes breathe {
      0%,100% { box-shadow: 0 0 7px var(--gold-glow), 0 0 14px rgba(255,212,59,0.25); }
      50%      { box-shadow: 0 0 13px var(--gold-glow), 0 0 26px rgba(255,212,59,0.4); }
    }

    @keyframes rowIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .year-row { opacity: 0; animation: rowIn 0.4s ease forwards; }

    @media (prefers-reduced-motion: reduce) {
      .year-row { animation: none; opacity: 1; }
    }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed;
      background: rgba(22,22,40,0.97);
      border: 1px solid rgba(76,110,245,0.3);
      color: #dde;
      padding: 0.35rem 0.8rem;
      border-radius: 8px;
      font-size: 0.7rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s ease;
      z-index: 999;
      white-space: nowrap;
      backdrop-filter: blur(6px);
    }
    #tooltip.show { opacity: 1; }

    /* ── Back-to-now button ── */
    #backBtn {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: rgba(14,14,28,0.92);
      border: 1px solid rgba(255,212,59,0.35);
      color: var(--gold);
      padding: 0.55rem 1.1rem;
      border-radius: 10px;
      font-size: 0.72rem;
      font-family: inherit;
      cursor: pointer;
      backdrop-filter: blur(10px);
      letter-spacing: 0.08em;
      z-index: 200;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.25s ease, transform 0.25s ease, background 0.2s ease;
      pointer-events: none;
    }
    #backBtn.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    #backBtn:hover   { background: rgba(255,212,59,0.1); border-color: var(--gold); }

    /* ── Footer ── */
    footer {
      margin-top: 3.5rem;
      font-size: 0.68rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.9;
      letter-spacing: 0.04em;
    }

    /* ── Mobile ── */
    @media (max-width: 680px) {
      body { padding: 2rem 0.75rem 5rem; }
      h1   { font-size: 1.25rem; letter-spacing: 0.2em; }
      .stats-section { width: 100%; max-width: 100%; }
      .settings-panel { width: 100%; max-width: 100%; }
      .settings-field { min-width: 100%; }
      .stats-row { flex-wrap: wrap; }
      .stats-row.primary .stat   { padding: 0.75rem 0.8rem; min-width: calc(50% - 1px); }
      .stats-row.secondary .stat { padding: 0.8rem 0.9rem; min-width: 100%; }
      .week       { width: 6px; height: 6px; border-radius: 1px; }
      .col-labels { gap: 1px; }
      .col-label  { width: 6px; font-size: 0.45rem; }
      .grid       { gap: 1px; }
      .year-row   { gap: 1px; }
      .row-label  { width: 24px; font-size: 0.5rem; }
      #backBtn    { bottom: 1.2rem; right: 1.2rem; }
    }
  </style>
</head>
<body>

<div id="tooltip"></div>
<button id="backBtn">● сейчас</button>

<header class="header">
  <h1>Календарь жизни</h1>
  <p class="header-meta">каждая клетка — одна неделя</p>
</header>

<section class="settings-panel" aria-label="Параметры календаря">
  <form class="settings-form" id="settingsForm">
    <div class="settings-field">
      <label for="birthInput">Дата рождения</label>
      <input class="settings-input" id="birthInput" type="date" required>
    </div>
    <div class="settings-field">
      <label for="lifespanInput">Продолжительность жизни (лет)</label>
      <input class="settings-input" id="lifespanInput" type="number" min="1" max="130" required>
    </div>
    <div class="settings-actions">
      <button class="settings-btn primary" type="submit">Применить</button>
      <button class="settings-btn" id="resetSettingsBtn" type="button">Сбросить</button>
    </div>
  </form>
  <p class="settings-message" id="settingsMessage" aria-live="polite"></p>
</section>

<div class="live-counter">
  <div class="counter-time">
    <span class="counter-days" id="cDays">0</span> дн &nbsp;
    <span id="cH">00</span>:<span id="cM">00</span>:<span class="counter-secs" id="cS">00</span>
  </div>
  <div class="counter-label" id="counterLabel"></div>
</div>

<div class="stats-section">
  <div class="stats-row primary">
    <div class="stat"><div class="stat-value"        id="sDays">—</div><div class="stat-label">Дней</div></div>
    <div class="stat"><div class="stat-value blue"   id="sWeeks">—</div><div class="stat-label">Недель</div></div>
    <div class="stat"><div class="stat-value violet" id="sMonths">—</div><div class="stat-label">Месяцев</div></div>
    <div class="stat"><div class="stat-value gold"   id="sYears">—</div><div class="stat-label">Лет</div></div>
  </div>
  <div class="stats-row secondary">
    <div class="stat">
      <div class="insight-label">Точный возраст</div>
      <div class="age-breakdown">
        <div class="age-unit"><span class="age-num" id="iY">—</span><span class="age-lbl">лет</span></div>
        <div class="age-unit"><span class="age-num" id="iM">—</span><span class="age-lbl">мес</span></div>
        <div class="age-unit"><span class="age-num" id="iD">—</span><span class="age-lbl">дн</span></div>
      </div>
    </div>
    <div class="stat">
      <div class="insight-label">До дня рождения</div>
      <div class="insight-main" id="iBdMain">—</div>
      <div class="insight-sub"  id="iBdSub"></div>
    </div>
    <div class="stat">
      <div class="insight-label">Конец жизни (приблизительно)</div>
      <div class="insight-main" id="iEndMain">—</div>
      <div class="insight-sub"  id="iEndSub"></div>
    </div>
  </div>
</div>

<div class="progress-wrap">
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"><div class="progress-dot"></div></div>
  </div>
  <div class="progress-labels">
    <span id="birthLabel"></span>
    <span id="progressLabel"></span>
    <span id="endLabel"></span>
  </div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot past"></div><span>Прожито</span></div>
  <div class="legend-item"><div class="legend-dot current"></div><span>Сейчас</span></div>
  <div class="legend-item"><div class="legend-dot future"></div><span>Впереди</span></div>
</div>

<div class="calendar-outer">
  <div class="col-labels" id="colLabels"></div>
  <div class="grid" id="grid"></div>
</div>

<footer id="footer"></footer>

<script>
  const DEFAULT_BIRTH = new Date(2001, 4, 12); // месяцы: 0=янв … 4=май … 11=дек
  const DEFAULT_LIFESPAN = 71;                  // ожидаемая продолжительность жизни (лет)
  const STORAGE_KEY = 'lifeCalendarConfig';

  const WEEKS = 52;
  const MS_WEEK = 7 * 24 * 60 * 60 * 1000;
  const DAY_MS = 24 * 60 * 60 * 1000;
  const MIN_LIFESPAN = 1;
  const MAX_LIFESPAN = 130;

  const refs = {
    counterLabel: document.getElementById('counterLabel'),
    cDays: document.getElementById('cDays'),
    cH: document.getElementById('cH'),
    cM: document.getElementById('cM'),
    cS: document.getElementById('cS'),
    sDays: document.getElementById('sDays'),
    sWeeks: document.getElementById('sWeeks'),
    sMonths: document.getElementById('sMonths'),
    sYears: document.getElementById('sYears'),
    iY: document.getElementById('iY'),
    iM: document.getElementById('iM'),
    iD: document.getElementById('iD'),
    iBdMain: document.getElementById('iBdMain'),
    iBdSub: document.getElementById('iBdSub'),
    iEndMain: document.getElementById('iEndMain'),
    iEndSub: document.getElementById('iEndSub'),
    progressFill: document.getElementById('progressFill'),
    progressLabel: document.getElementById('progressLabel'),
    birthLabel: document.getElementById('birthLabel'),
    endLabel: document.getElementById('endLabel'),
    colLabels: document.getElementById('colLabels'),
    grid: document.getElementById('grid'),
    footer: document.getElementById('footer'),
    tooltip: document.getElementById('tooltip'),
    backBtn: document.getElementById('backBtn'),
    settingsForm: document.getElementById('settingsForm'),
    birthInput: document.getElementById('birthInput'),
    lifespanInput: document.getElementById('lifespanInput'),
    settingsMessage: document.getElementById('settingsMessage'),
    resetSettingsBtn: document.getElementById('resetSettingsBtn')
  };

  let state = loadConfig();
  let weekCells = [];
  let currentCell = null;
  let lastCurrentCellDateKey = '';

  function fmtDate(d, opts) {
    return d.toLocaleDateString('ru-RU', opts || { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function pad(n) { return String(n).padStart(2, '0'); }

  function clamp(n, min, max) {
    return Math.min(max, Math.max(min, n));
  }

  function startOfDay(d) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function dateToInputValue(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function parseInputDate(value) {
    if (!value) return null;
    const [year, month, day] = value.split('-').map(Number);
    const parsed = new Date(year, month - 1, day);
    if (
      !Number.isFinite(year) ||
      !Number.isFinite(month) ||
      !Number.isFinite(day) ||
      Number.isNaN(parsed.getTime()) ||
      parsed.getFullYear() !== year ||
      parsed.getMonth() !== month - 1 ||
      parsed.getDate() !== day
    ) {
      return null;
    }
    return parsed;
  }

  function ensureValidBirth(inputBirth) {
    const today = startOfDay(new Date());
    const safeBirth = Number.isNaN(inputBirth?.getTime?.()) ? new Date(DEFAULT_BIRTH) : new Date(inputBirth);
    return safeBirth > today ? today : safeBirth;
  }

  function normalizeConfig(raw) {
    const birthRaw = raw?.birth instanceof Date ? raw.birth : new Date(raw?.birth || DEFAULT_BIRTH);
    const birth = ensureValidBirth(birthRaw);

    const life = Number(raw?.lifespan);
    const lifespan = Number.isFinite(life) ? Math.round(life) : DEFAULT_LIFESPAN;

    return {
      birth,
      lifespan: clamp(lifespan, MIN_LIFESPAN, MAX_LIFESPAN)
    };
  }

  function loadConfig() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      return normalizeConfig(parsed);
    } catch (_) {
      return normalizeConfig({});
    }
  }

  function saveConfig(config) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      birth: dateToInputValue(config.birth),
      lifespan: config.lifespan
    }));
  }

  function resetStoredConfig() {
    localStorage.removeItem(STORAGE_KEY);
  }

  function exactAge(fromDate, toDate) {
    let y = toDate.getFullYear() - fromDate.getFullYear();
    let m = toDate.getMonth() - fromDate.getMonth();
    let d = toDate.getDate() - fromDate.getDate();
    if (d < 0) { m--; d += new Date(toDate.getFullYear(), toDate.getMonth(), 0).getDate(); }
    if (m < 0) { y--; m += 12; }
    return { y: Math.max(0, y), m: Math.max(0, m), d: Math.max(0, d) };
  }

  function daysToNextBirthday(birth, today) {
    const dayToday = startOfDay(today);
    const next = new Date(dayToday.getFullYear(), birth.getMonth(), birth.getDate());
    if (next < dayToday) next.setFullYear(dayToday.getFullYear() + 1);
    return Math.round((next - dayToday) / DAY_MS);
  }

  function getEndDate(config) {
    const endDate = new Date(config.birth);
    endDate.setFullYear(config.birth.getFullYear() + config.lifespan);
    return endDate;
  }

  function computeStats(now, config) {
    const endDate = getEndDate(config);
    const livedMs = Math.max(0, now - config.birth);
    const totalMs = Math.max(1, endDate - config.birth);
    const progress = clamp(livedMs / totalMs, 0, 1);
    const livedDays = Math.floor(livedMs / DAY_MS);
    const livedWeeks = Math.floor(livedMs / MS_WEEK);

    const age = exactAge(config.birth, now);
    const bdDays = daysToNextBirthday(config.birth, now);
    const nextBD = new Date(startOfDay(now).getFullYear(), config.birth.getMonth(), config.birth.getDate());
    if (nextBD < startOfDay(now)) nextBD.setFullYear(now.getFullYear() + 1);

    const endDiff = endDate - now;
    const endDelta = endDiff > 0 ? exactAge(now, endDate) : { y: 0, m: 0, d: 0 };

    return {
      endDate,
      livedDays,
      livedWeeks,
      livedMonths: age.y * 12 + age.m,
      age,
      bdDays,
      nextBD,
      endDiff,
      endDelta,
      progressPct: (progress * 100).toFixed(1)
    };
  }

  function renderLiveCounter(now) {
    const total = Math.max(0, Math.floor((now - state.birth) / 1000));
    refs.cDays.textContent = Math.floor(total / 86400).toLocaleString('ru');
    refs.cH.textContent = pad(Math.floor(total / 3600) % 24);
    refs.cM.textContent = pad(Math.floor(total / 60) % 60);
    refs.cS.textContent = pad(total % 60);
  }

  function renderStats(stats) {
    refs.sDays.textContent = stats.livedDays.toLocaleString('ru');
    refs.sWeeks.textContent = stats.livedWeeks.toLocaleString('ru');
    refs.sMonths.textContent = stats.livedMonths.toLocaleString('ru');
    refs.sYears.textContent = stats.age.y.toLocaleString('ru');
    refs.iY.textContent = stats.age.y;
    refs.iM.textContent = stats.age.m;
    refs.iD.textContent = stats.age.d;

    refs.iBdMain.classList.remove('soon', 'done');
    if (stats.bdDays === 0) {
      refs.iBdMain.textContent = 'Сегодня!';
      refs.iBdMain.classList.add('done');
    } else {
      refs.iBdMain.textContent = `через ${stats.bdDays} ${stats.bdDays === 1 ? 'день' : stats.bdDays < 5 ? 'дня' : 'дней'}`;
      if (stats.bdDays <= 30) refs.iBdMain.classList.add('soon');
    }
    refs.iBdSub.textContent = fmtDate(stats.nextBD, { day: 'numeric', month: 'long' });

    refs.iEndMain.textContent = stats.endDiff > 0
      ? `через ${stats.endDelta.y} л ${stats.endDelta.m} мес`
      : 'Срок наступил';
    refs.iEndSub.textContent = fmtDate(stats.endDate, { day: 'numeric', month: 'long', year: 'numeric' });

    refs.progressFill.style.width = `${stats.progressPct}%`;
    refs.progressLabel.textContent = `${stats.progressPct}% прожито`;
    refs.birthLabel.textContent = fmtDate(state.birth, { day: 'numeric', month: 'short', year: 'numeric' });
    refs.endLabel.textContent = fmtDate(stats.endDate, { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function showSettingsMessage(text, isError) {
    refs.settingsMessage.textContent = text;
    refs.settingsMessage.classList.toggle('error', Boolean(isError));
  }

  function showTipAt(html, x, y) {
    refs.tooltip.innerHTML = html;
    refs.tooltip.classList.add('show');
    const tipX = x + 14;
    const tipY = y - 40;
    refs.tooltip.style.left = (tipX + refs.tooltip.offsetWidth > innerWidth ? x - refs.tooltip.offsetWidth - 14 : tipX) + 'px';
    refs.tooltip.style.top = (tipY < 0 ? y + 14 : tipY) + 'px';
  }

  function showTipForElement(el, html) {
    const rect = el.getBoundingClientRect();
    showTipAt(html, rect.left + rect.width / 2, rect.top);
  }

  function moveTip(e) {
    if (!refs.tooltip.classList.contains('show')) return;
    showTipAt(refs.tooltip.innerHTML, e.clientX, e.clientY);
  }

  function hideTip() {
    refs.tooltip.classList.remove('show');
  }

  function weekTipHtml(item, isCurrent) {
    return `
      <span style="color:var(--muted);font-size:0.62rem">Возраст ${item.year} лет · неделя ${item.week}</span><br>
      ${fmtDate(item.start)} — ${fmtDate(item.end)}
      ${isCurrent ? '<br><span style="color:var(--gold)">← сейчас</span>' : ''}
    `;
  }

  function weekAriaLabel(item, isCurrent) {
    return `Возраст ${item.year} лет, неделя ${item.week}: ${fmtDate(item.start)} — ${fmtDate(item.end)}${isCurrent ? ', текущая неделя' : ''}`;
  }

  function updateWeekStates(now) {
    currentCell = null;
    for (const item of weekCells) {
      const isCurrent = item.start <= now && item.end >= now;
      const isPast = item.end < now && !isCurrent;

      item.el.classList.remove('past', 'future', 'current');
      item.el.style.background = '';

      if (isCurrent) {
        item.el.classList.add('current');
        currentCell = item.el;
      } else if (isPast) {
        item.el.classList.add('past');
        item.el.style.background = item.pastColor;
      } else {
        item.el.classList.add('future');
      }

      const tip = weekTipHtml(item, isCurrent);
      item.tipHtml = tip;
      item.el.setAttribute('aria-label', weekAriaLabel(item, isCurrent));
    }
  }

  function buildColumnLabels() {
    refs.colLabels.innerHTML = '';
    for (let w = 0; w < WEEKS; w++) {
      const el = document.createElement('div');
      el.className = 'col-label';
      el.textContent = (w === 0 || (w + 1) % 10 === 0) ? (w + 1) : '';
      refs.colLabels.appendChild(el);
    }
  }

  function buildGrid(config) {
    refs.grid.innerHTML = '';
    weekCells = [];

    for (let yr = 0; yr < config.lifespan; yr++) {
      const row = document.createElement('div');
      row.className = 'year-row' + (yr > 0 && yr % 10 === 0 ? ' decade-gap' : '');
      row.style.animationDelay = `${yr * 11}ms`;

      const lbl = document.createElement('div');
      lbl.className = 'row-label' + (yr % 10 === 0 ? ' decade' : '');
      lbl.textContent = yr % 10 === 0 ? yr : '';
      row.addEventListener('mouseenter', () => { lbl.textContent = yr; });
      row.addEventListener('mouseleave', () => { lbl.textContent = yr % 10 === 0 ? yr : ''; });
      row.appendChild(lbl);

      const yearStart = new Date(config.birth);
      yearStart.setFullYear(config.birth.getFullYear() + yr);
      const hue = Math.round(215 + (yr / Math.max(1, config.lifespan - 1)) * 55);
      const pastColor = `hsl(${hue},68%,55%)`;

      for (let w = 0; w < WEEKS; w++) {
        const ws = new Date(yearStart);
        ws.setDate(yearStart.getDate() + w * 7);
        const we = new Date(ws);
        we.setDate(ws.getDate() + 6);

        const cell = document.createElement('div');
        cell.className = 'week';
        cell.tabIndex = 0;
        cell.setAttribute('role', 'img');

        const item = {
          el: cell,
          year: yr,
          week: w + 1,
          start: ws,
          end: we,
          pastColor,
          tipHtml: ''
        };
        weekCells.push(item);

        cell.addEventListener('mouseenter', (e) => showTipAt(item.tipHtml, e.clientX, e.clientY));
        cell.addEventListener('mousemove', moveTip);
        cell.addEventListener('mouseleave', hideTip);
        cell.addEventListener('focus', () => showTipForElement(cell, item.tipHtml));
        cell.addEventListener('blur', hideTip);
        cell.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') hideTip();
        });

        row.appendChild(cell);
      }

      refs.grid.appendChild(row);
    }

    const totalWeeks = config.lifespan * WEEKS;
    refs.footer.textContent = `${config.lifespan} год × ${WEEKS} недели = ${totalWeeks.toLocaleString('ru')} клеток`;
  }

  function checkScroll() {
    if (!currentCell) {
      refs.backBtn.classList.remove('visible');
      return;
    }
    const { top, bottom } = currentCell.getBoundingClientRect();
    refs.backBtn.classList.toggle('visible', !(top >= 80 && bottom <= innerHeight - 40));
  }

  function maybeScrollToCurrentCell() {
    if (!currentCell) return;
    setTimeout(() => {
      currentCell.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, Math.min(state.lifespan * 11 + 500, 1500));
  }

  function renderDateBoundUI() {
    refs.counterLabel.textContent =
      `прожито с ${fmtDate(state.birth, { day: 'numeric', month: 'long', year: 'numeric' })}`;
    refs.birthInput.value = dateToInputValue(state.birth);
    refs.lifespanInput.value = state.lifespan;
  }

  function refreshData(forceWeekRecalc) {
    const now = new Date();
    renderLiveCounter(now);
    renderStats(computeStats(now, state));

    const currentDateKey = dateToInputValue(now);
    if (forceWeekRecalc || currentDateKey !== lastCurrentCellDateKey) {
      updateWeekStates(now);
      lastCurrentCellDateKey = currentDateKey;
    }
    checkScroll();
  }

  function rerenderAll(options) {
    const shouldScroll = Boolean(options?.scrollToCurrent);
    renderDateBoundUI();
    buildGrid(state);
    refreshData(true);
    if (shouldScroll) maybeScrollToCurrentCell();
  }

  function applyFormConfig() {
    const birth = parseInputDate(refs.birthInput.value);
    if (!birth) {
      showSettingsMessage('Некорректная дата рождения.', true);
      return;
    }
    const lifespanRaw = Number(refs.lifespanInput.value);
    if (!Number.isFinite(lifespanRaw)) {
      showSettingsMessage('Некорректная продолжительность жизни.', true);
      return;
    }

    state = normalizeConfig({ birth, lifespan: lifespanRaw });
    saveConfig(state);
    rerenderAll({ scrollToCurrent: true });
    showSettingsMessage('Параметры сохранены.', false);
  }

  function resetConfigToDefaults() {
    resetStoredConfig();
    state = normalizeConfig({ birth: DEFAULT_BIRTH, lifespan: DEFAULT_LIFESPAN });
    rerenderAll({ scrollToCurrent: true });
    showSettingsMessage('Параметры сброшены к значениям по умолчанию.', false);
  }

  refs.settingsForm.addEventListener('submit', (e) => {
    e.preventDefault();
    applyFormConfig();
  });
  refs.resetSettingsBtn.addEventListener('click', resetConfigToDefaults);

  refs.backBtn.addEventListener('click', () => currentCell?.scrollIntoView({ behavior: 'smooth', block: 'center' }));
  window.addEventListener('scroll', checkScroll, { passive: true });
  window.addEventListener('focus', () => refreshData(true));
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refreshData(true);
  });

  buildColumnLabels();
  rerenderAll({ scrollToCurrent: true });
  setInterval(() => renderLiveCounter(new Date()), 1000);
  setInterval(() => refreshData(false), 60 * 1000);
</script>
</body>
</html>
